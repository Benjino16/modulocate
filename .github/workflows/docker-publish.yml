# Builds the four production images (infra/Dockerfile.<service>) and
# publishes them to GHCR.
#
# Triggers:
# - push to main: rebuilds every service and pushes `:latest` + `:sha-<short
#   sha>`, matching compose.yaml's default (MODULOCATE_IMAGE_TAG=latest).
# - version tags (v1.2.3): additionally pushes `:1.2.3` and `:1.2` for
#   pinned/rollback deploys via MODULOCATE_IMAGE_TAG.
# - workflow_dispatch: manual rebuild (e.g. to repush after a GHCR issue).
name: Build and Publish Docker Images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # Must match the Dockerfile.<service> names in infra/ and the
        # ghcr.io/.../modulocate-<service> image names compose.yaml
        # expects.
        service: [backend, worker, portal, vote]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: image
        # GHCR requires a lowercase repository path; github.repository_owner
        # isn't guaranteed to be lowercase (this repo's owner isn't).
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/modulocate-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
