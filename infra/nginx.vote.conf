# Serves the vote SPA build under /voting/ — see infra/nginx.portal.conf,
# same reasoning, just the other base path (vite.config.ts's base: '/voting/'
# and infra/traefik/dynamic.yml's PathPrefix(`/voting`) router).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz {
        default_type text/plain;
        return 200 "ok";
    }

    location /voting/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /voting/ {
        try_files $uri $uri/ /voting/index.html;
        add_header Cache-Control "no-cache";
    }
}
