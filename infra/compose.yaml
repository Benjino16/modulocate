services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: modulocate
      POSTGRES_PASSWORD: modulocate
      POSTGRES_DB: modulocate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modulocate"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Fronts backend/portal/vote under one origin (http://modulocate.localhost)
  # so staff/student session cookies and tRPC calls are all same-origin — no
  # CORS or cross-origin cookie config needed, in dev or prod (prod runs
  # behind Traefik with this exact same path layout). Routing is a static
  # file (infra/traefik/dynamic.yml), not the Docker-label provider — the
  # set of routed services is fixed, so this avoids depending on
  # container↔daemon API compatibility just to read labels.
  traefik:
    image: traefik:v3.3
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --api.insecure=true # dev-only dashboard, no auth
    ports:
      - "80:80"
      - "8080:8080" # dashboard: http://localhost:8080
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
    depends_on:
      - backend
      - portal
      - vote

  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.dev
    command: pnpm --filter @modulocate/backend dev
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://modulocate:modulocate@postgres:5432/modulocate
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_URL: http://modulocate.localhost
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.dev
    command: pnpm --filter @modulocate/worker dev
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://modulocate:modulocate@postgres:5432/modulocate
      REDIS_URL: redis://redis:6379
      VOTE_APP_URL: http://modulocate.localhost/voting
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  portal:
    build:
      context: ..
      dockerfile: infra/Dockerfile.dev
    command: pnpm --filter @modulocate/portal-web dev
    depends_on:
      - backend

  vote:
    build:
      context: ..
      dockerfile: infra/Dockerfile.dev
    command: pnpm --filter @modulocate/vote-web dev
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
