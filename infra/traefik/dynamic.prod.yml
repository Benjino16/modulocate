# Prod counterpart to dynamic.yml — same path layout (backend/portal/vote
# behind one origin), but portal/vote now point at the nginx-served static
# builds (infra/Dockerfile.portal, infra/Dockerfile.vote) on port 8080
# instead of the Vite dev server ports (5173/5174).
#
# Still no Host() match, same reasoning as dev: keeps this file usable
# regardless of which hostname/IP actually reaches the box — it'd otherwise
# have to be kept in sync with DOMAIN in compose.yaml (repo root), and this
# file can't see that env var (it's a plain file mount, not part of the
# compose file's own variable substitution). If a spoofed Host header
# reaching a router by IP is a concern, tighten these to
# Host(`your-domain`) && PathPrefix(...) by hand.
#
# `tls: {}` on every router below just turns on TLS termination for that
# router — the actual cert (for DOMAIN, via Let's Encrypt) is requested
# statically by the websecure entrypoint in compose.yaml, not derived
# from these rules.
http:
  routers:
    backend:
      rule: "PathPrefix(`/api`)"
      service: backend
      tls: {}
    portal:
      rule: "PathPrefix(`/portal`)"
      service: portal
      middlewares:
        - add-trailing-slash-portal
      tls: {}
    vote:
      rule: "PathPrefix(`/voting`)"
      service: vote
      middlewares:
        - add-trailing-slash-vote
      tls: {}
    root:
      rule: "Path(`/`)"
      service: vote
      middlewares:
        - redirect-root
      tls: {}

  middlewares:
    redirect-root:
      redirectRegex:
        regex: "^(https?://[^/]+)/$"
        replacement: "${1}/voting/"
    add-trailing-slash-portal:
      redirectRegex:
        regex: "^(https?://[^/]+)/portal$"
        replacement: "${1}/portal/"
    add-trailing-slash-vote:
      redirectRegex:
        regex: "^(https?://[^/]+)/voting$"
        replacement: "${1}/voting/"

  services:
    backend:
      loadBalancer:
        servers:
          - url: "http://backend:3000"
    portal:
      loadBalancer:
        servers:
          - url: "http://portal:8080"
    vote:
      loadBalancer:
        servers:
          - url: "http://vote:8080"
