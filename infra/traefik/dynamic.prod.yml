# Prod counterpart to dynamic.yml — same path layout (backend/portal/vote
# behind one origin), but portal/vote now point at the nginx-served static
# builds (infra/Dockerfile.portal, infra/Dockerfile.vote) on port 8080
# instead of the Vite dev server ports (5173/5174).
#
# Still no Host() match, same reasoning as dev: keeps this file usable
# regardless of which hostname/IP actually reaches the box — it'd otherwise
# have to be kept in sync with DOMAIN in compose.yaml (repo root), and this
# file can't see that env var (it's a plain file mount, not part of the
# compose file's own variable substitution). If a spoofed Host header
# reaching a router by IP is a concern, tighten these to
# Host(`your-domain`) && PathPrefix(...) by hand.
#
# None of the routers below declare their own `tls:` section, and that's
# deliberate: a router-level `tls:` — even an empty `tls: {}` — *replaces*
# the entrypoint's TLS config for that router instead of merging with it
# (confirmed against Traefik's own docs after this broke ACME issuance in
# prod: the websecure entrypoint's static tls.certResolver + tls.domains in
# compose.yaml never fired because every router here shadowed it with an
# empty tls section, and PathPrefix-only rules give Traefik no Host() to
# fall back to for deriving a domain — silently, no error logged). Leaving
# `tls:` off these routers entirely means they inherit the entrypoint's TLS
# config as-is and are still served over HTTPS on websecure — no per-router
# opt-in needed.
http:
  routers:
    backend:
      rule: "PathPrefix(`/api`)"
      service: backend
    portal:
      rule: "PathPrefix(`/portal`)"
      service: portal
      middlewares:
        - add-trailing-slash-portal
    vote:
      rule: "PathPrefix(`/voting`)"
      service: vote
      middlewares:
        - add-trailing-slash-vote
    root:
      rule: "Path(`/`)"
      service: vote
      middlewares:
        - redirect-root

  middlewares:
    redirect-root:
      redirectRegex:
        regex: "^(https?://[^/]+)/$"
        replacement: "${1}/voting/"
    add-trailing-slash-portal:
      redirectRegex:
        regex: "^(https?://[^/]+)/portal$"
        replacement: "${1}/portal/"
    add-trailing-slash-vote:
      redirectRegex:
        regex: "^(https?://[^/]+)/voting$"
        replacement: "${1}/voting/"

  services:
    backend:
      loadBalancer:
        servers:
          - url: "http://backend:3000"
    portal:
      loadBalancer:
        servers:
          - url: "http://portal:8080"
    vote:
      loadBalancer:
        servers:
          - url: "http://vote:8080"
