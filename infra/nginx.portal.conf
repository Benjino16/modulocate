# Serves the portal SPA build under /portal/ — matches vite.config.ts's
# base: '/portal/' (asset URLs in the built index.html are already prefixed
# with it) and infra/traefik/dynamic.yml's PathPrefix(`/portal`) router,
# which forwards the prefix through unstripped.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz {
        default_type text/plain;
        return 200 "ok";
    }

    # Vite content-hashes these filenames, so they're safe to cache forever —
    # a new deploy gets new filenames, never a stale cached one.
    location /portal/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback for client-side routing; index.html itself must always be
    # revalidated since it's what points at the current hashed asset names.
    location /portal/ {
        try_files $uri $uri/ /portal/index.html;
        add_header Cache-Control "no-cache";
    }
}
