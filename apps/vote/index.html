<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>modulocate Wahl</title>
    <script>
      // Applies the persisted theme before first paint to avoid a light-mode flash;
      // must stay in sync with ThemeProvider in packages/ui/src/components/theme-provider.tsx.
      (function () {
        var theme = localStorage.getItem("modulocate:theme");
        var isDark =
          theme === "dark" ||
          (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", isDark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
