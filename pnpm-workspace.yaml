packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
  msgpackr-extract: false

# Single source of truth for versions of dependencies that show up in 2+
# workspace packages — package.json entries reference these as "catalog:"
# instead of repeating the range, so bumping a shared dep is a one-line
# change here instead of hunting every package.json that uses it.
catalog:
  "@eslint/js": ^10.0.1
  "@react-pdf/renderer": ^4.5.1
  "@tailwindcss/vite": ^4.3.2
  "@tanstack/react-query": ^5.101.2
  "@tanstack/react-router": ^1.170.18
  "@tanstack/react-router-devtools": ^1.167.0
  "@tanstack/router-plugin": ^1.168.20
  "@trpc/client": ^11.18.0
  "@trpc/tanstack-react-query": ^11.18.0
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  "@vitejs/plugin-react": ^6.0.3
  better-auth: ^1.6.25
  bullmq: ^5.80.5
  drizzle-orm: ^0.45.2
  eslint: ^10.6.0
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-react-refresh: ^0.5.3
  globals: ^17.7.0
  ioredis: ^5.11.1
  lucide-react: ^1.24.0
  nodemailer: ^9.0.3
  postgres: ^3.4.9
  react: ^19.2.7
  react-dom: ^19.2.7
  tsx: ^4.23.1
  typescript-eslint: ^8.62.0
  vite: ^8.1.1
  zod: ^4.4.3

# typescript / @types/node intentionally track two different lines: backend,
# worker and the Node-side packages sit on TS 7 / @types/node 26, while
# portal/vote (and their Vite toolchain) are still pinned to TS ~6.0.2 /
# @types/node 24 — kept as separate named catalogs rather than one shared
# entry so that split stays visible and deliberate instead of silently
# drifting back together on the next bump.
catalogs:
  node:
    typescript: ^7.0.2
    "@types/node": ^26.1.1
  frontend:
    typescript: ~6.0.2
    "@types/node": ^24.13.2
